spring.application.name=dispatch-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:sqlite:dispatch.db}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql
spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.wmrt=${LOG_LEVEL_APP:DEBUG}
